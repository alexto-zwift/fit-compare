<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#35424a" stroke="#e8491d" stroke-width="3"/>
  
  <!-- Left runner -->
  <g transform="translate(70, 100)">
    <!-- Head -->
    <circle cx="0" cy="-25" r="8" fill="#ffffff"/>
    <!-- Body -->
    <line x1="0" y1="-17" x2="0" y2="5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Left arm up -->
    <line x1="0" y1="-10" x2="-10" y2="-20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arm down -->
    <line x1="0" y1="-10" x2="10" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left leg -->
    <line x1="0" y1="5" x2="-8" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="0" y1="5" x2="8" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Right runner -->
  <g transform="translate(130, 100)">
    <!-- Head -->
    <circle cx="0" cy="-25" r="8" fill="#ffffff"/>
    <!-- Body -->
    <line x1="0" y1="-17" x2="0" y2="5" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <!-- Left arm down -->
    <line x1="0" y1="-10" x2="-10" y2="0" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right arm up -->
    <line x1="0" y1="-10" x2="10" y2="-20" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Left leg -->
    <line x1="0" y1="5" x2="-8" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
    <!-- Right leg -->
    <line x1="0" y1="5" x2="8" y2="18" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  
  <!-- Center comparison symbol (vs) -->
  <text x="100" y="115" font-size="20" font-weight="bold" fill="#e8491d" text-anchor="middle" font-family="Arial">vs</text>
</svg>
